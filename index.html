		function onPopState(event) {
			if(forgetPop){

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}

			}
	};

}
```

>Лучше всего объявлять одну переменную в строке.

## Оператор присваивания

```cpp
int width; // объявление целочисленной переменной width
width = 5; // присваивание значения 5 переменной width

// теперь переменная width хранит значение 5
```

## Оператор присваивания

```cpp
#include <iostream>

int main()
{
	int width; // объявление целочисленной переменной width
	width = 5; // присваивание копированием значения 5 в переменную width

	std::cout << width; // выводит 5

	width = 7; // меняет значение, хранящееся в переменной width, в 7

	std::cout << width; // выводит 7

	return 0;
}
```

**Вывод:** `57`
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Инициализация переменных

```cpp
#include <iostream>

int main()
{
    int width { 5 };    // объявление и инициализация переменной width
    std::cout << width; // выводит 5

    return 0;
}
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Виды инициализации

```cpp
int a;         // объявление без инициализации

// Обычные способы инициализации:
int b = 5;     // копирующая инициализация
int c ( 6 );   // прямая инициализация

// Современные способы инициализации (предпочтительно):
int d { 7 };   // инициализация списком
int e {};
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Инициализация по умолчанию

Если инициализации нет (как в случае с переменной `a`), это называется **инициализацией по умолчанию**. В большинстве случаев она не выполняет никакой инициализации, оставляя переменной неопределенное значение, которое невозможно предсказать (иногда его называют "мусорным значением").
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Копирующая инициализация

Когда после знака равенства задается начальное значение, это называется **копирующей инициализацией**. Этот метод был унаследован от языка Си.

```cpp
int width = 5;
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Прямая инициализация

Когда начальное значение указано в круглых скобках, это называется **прямой инициализацией**.

```cpp
int width ( 5 );
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Инициализация списком

Сегодня в C++ для создания объектов часто используют **инициализацию списком**.

Инициализация списка может быть двух видов:

```cpp
int width { 5 };    // прямая инициализация списком. Значение 5 присваивается переменной width (предпочтительно)
int height = { 6 }; // копирующая инициализация списком. Значение 6 присваивается переменной height (редко используется)
```

> Когда мы видим фигурные скобки, мы знаем, что инициализируем объект списком.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Преимущество инициализации списком

Одно из главных преимуществ использования списков для инициализации в C++ — **запрет на сужающие преобразования**.

```cpp
    
    int w1 { 4.5 }; // ошибка компиляции: list-init не позволяет сузить преобразование

    int w2 = 4.5;   // компилируется: в w2 копируется значение 4
    int w3 (4.5);   // компилируется: w3 инициализирована со значением 4

    return 0;
```

> Обратите внимание, что это ограничение на сужающие преобразования применяется только к инициализации списка, а не к каким-либо последующим назначениям переменной.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Инициализация значением и нулевая инициализация

При инициализации переменной с пустыми фигурными скобками применяется особая форма инициализации списка — **инициализация значения**. 

Обычно в этом случае переменная автоматически получает значение нуля (или наиболее близкое к нулю значение для данного типа). Процесс обнуления называется **нулевой инициализацией**.

> Для инициализации ваших переменных предпочитайте прямую инициализацию списком или значением.

## { 0 } или {}?

> Используйте прямую инициализацию списка, когда вы на самом деле используете начальное значение:
> ```cpp
> int x { 0 };    // прямая инициализация значением 0
> std::cout << x;  // выводим известное нам значение 0
> ```
> 	
> Используйте инициализацию значением когда значение объекта является временным и будет заменено:
> ```cpp
> int x {};      // инициализация значением
> std::cin >> x; //  сразу же меняем это значение
> ```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Создание экземпляра

Термин **"создание экземпляра"** - это модное слово, которое означает, что переменная была создана и инициализирована. Созданный объект называют **экземпляром**. Чаще всего этот термин применяется к объектам классов, но иногда он применяется и к объектам других типов.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Инициализация нескольких переменных

В одной строке кода можно создать несколько переменных одного типа, разделив их имена запятой.

```cpp
int a, b; // создаём переменные a и b, но не инициализируем их
```
Лучше избегать этого синтаксиса. Вы можете инициализировать несколько переменных, определенных в одной строке:
```cpp
int a = 5, b = 6;          // copy-initialization
int c ( 7 ), d ( 8 );      // direct-initialization
int e { 9 }, f { 10 };     // direct-list-initialization
int i {}, j {};            // value-initialization
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

```

## Предупреждения о неиспользуемых переменных

```cpp
int main()
{
    int x { 5 }; // переменная "x" инициализирована

    // но больше нигде не используется

    return 0;
}
```

При компиляции этого с помощью GCC генерируется следующее исключение:
```
prog.cc: In function 'int main()':
prog.cc:3:9: error: unused variable 'x' [-Werror=unused-variable]
```
**Как исправить?**
1. Если переменная не нужна, удалите её.
2. Используйте переменную где-нибудь.

## Атрибут \[\[maybe_unused\]\] (C++17)


```cpp
#include <iostream>

int main()
{
    // Какие-то физические значения, которые мы откуда-то скопировали
    [[maybe_unused]] double pi { 3.14159 };
    [[maybe_unused]] double gravity { 9.8 };
    [[maybe_unused]] double phi { 1.61803 };

    std::cout << pi << '\n';
    std::cout << phi << '\n';

    // Компилятор больше не будет предупреждать о том, что гравитация не используется

    return 0;
}
```

		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;

		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
